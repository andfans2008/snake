<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Snake</h1>
      <section class="hud">
        <p>Score: <strong data-score>0</strong></p>
        <p>Status: <strong data-status>Running</strong></p>
      </section>

      <section class="board" data-grid aria-label="Snake board"></section>

      <section class="actions">
        <button type="button" data-action="pause">Pause</button>
        <button type="button" data-action="restart">Restart</button>
      </section>

      <section class="controls" aria-label="Direction controls">
        <button type="button" data-dir="up">Up</button>
        <div>
          <button type="button" data-dir="left">Left</button>
          <button type="button" data-dir="down">Down</button>
          <button type="button" data-dir="right">Right</button>
        </div>
      </section>

      <p class="hint">Controls: Arrow keys / WASD, Space to pause.</p>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
